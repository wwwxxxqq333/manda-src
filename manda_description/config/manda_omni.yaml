# ==========================================================
# Nav2 全向底盘实车导航配置 (manda_omni.yaml)
# 基于 nav2_swerve.yaml 改造，适配实车硬件
# ==========================================================
# 底盘: 4WID-4WIS Swerve Drive (manda_chassis_bridge)
# 雷达: LSLIDAR X10 → /scan  (LaserScan)
# 定位: AMCL omnidirectional
# 控制器: MPPIController (Omni 运动模型)
# 规划器: SmacPlanner2D (全向路径)
# ==========================================================

# ============================================================================
# 0. map_server — yaml_filename 由 launch 文件 "map" 参数注入，不在此硬编码
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 2.0

# ============================================================================
# 1. 局部代价地图 — 2D 激光雷达障碍物层
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      # 实车 footprint: 0.7m × 0.5m
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          observation_persistence: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.3

      always_send_full_costmap: true

# ============================================================================
# 2. 全局代价地图
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      transform_tolerance: 0.5
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.3

      always_send_full_costmap: true

# ============================================================================
# 3. MPPI 全向控制器 (Omni 运动模型)
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.05

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # ---- MPPI 全向控制器 ----
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # 【核心】全向运动模型
      motion_model: "Omni"

      # 时间参数
      time_steps: 56
      model_dt: 0.05

      # 采样参数
      batch_size: 2000
      temperature: 0.3
      gamma: 0.015

      # 速度噪声标准差
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.3

      # ====== 速度包络 (全向底盘需要放开 Vy) ======
      vx_max: 0.8
      vx_min: -0.3
      vy_max: 0.5
      vy_min: -0.5
      wz_max: 1.5

      # 加速度限制
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 1.2
      az_max: 3.2

      # 可视化 (实车建议关闭节省带宽)
      visualize: false

      # ====== 评价函数 (Critics) ======
      critics:
        - "ConstraintCritic"
        - "ObstaclesCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        repulsion_weight: 1.5
        critical_weight: 30.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.3

      GoalCritic:
        enabled: true
        cost_weight: 15.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_weight: 25.0
        max_path_occupancy_ratio: 0.05

      PathFollowCritic:
        enabled: true
        cost_weight: 25.0

      transform_tolerance: 0.1

# ============================================================================
# 4. 全局规划器 (SmacPlanner2D — 全向路径)
# ============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      # SmacPlanner2D 用 4-connected 或 8-connected 网格搜索
      # 不需要 Dubin/Reeds-Shepp 模型，天然支持全向
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ============================================================================
# 5. 路径平滑器
# ============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1

# ============================================================================
# 6. 行为树 (含 Spin 原地旋转恢复)
# ============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # 已移除 spin: 本工程不提供 /spin action (见下) 插件列表
    behavior_plugins: ["backup", "drive_on_heading", "wait"]

    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

# ============================================================================
# 7. AMCL 定位 — omnidirectional 全向运动模型
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: false

    # 【核心】全向运动模型
    robot_model_type: "omnidirectional"

    alpha1: 0.4
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.4
    alpha5: 0.2

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # 显式指定激光雷达话题（确保 AMCL 能收到扫描数据）
    scan_topic_name: /scan

    laser_model_type: "likelihood_field"
    laser_max_range: 20.0
    laser_min_range: 0.15
    laser_likelihood_max_dist: 2.0

    max_beams: 60
    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1

    sigma_hit: 0.2
    lambda_short: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5

    update_min_a: 0.2
    update_min_d: 0.25

    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false

# ============================================================================
# 8. BT Navigator
# ============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_xml_filename: ""
    transform_tolerance: 0.2
    goal_reached_tol: 0.15
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

# ============================================================================
# 9. 航点跟随
# ============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
